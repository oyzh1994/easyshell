version: '3.7'
services:
  # 主节点
  master:
    image: valkey/valkey:latest
    container_name: valkey-ssl
    volumes:
      - ./valkey-ssl.conf:/conf/valkey.conf
      - ./ca.crt:/ssl/ca.crt
      - ./valkey.dh:/ssl/valkey.dh
      - ./valkey.crt:/ssl/valkey.crt
      - ./valkey.key:/ssl/valkey.key
    ports:
      - 8380:8380
      - 8379:8379
    command: valkey-server /conf/valkey.conf
