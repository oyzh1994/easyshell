version: '3.7'
services:
  # 主节点
  master:
    image: valkey/valkey:latest
    container_name: valkey-master
    restart: no
    volumes:
      - ./valkey-master.conf:/conf/valkey.conf
    ports:
      - 6981:6981
    # 192.168.31.180（替换成自己的IP）master节点宿主机IP地址，如果安装同一台机子上，不能写127.0.0.1 因为这样访问的是容器本身的地址
    # command: valkey-server --port 6379 --requirepass 123456 --appendonly yes
    command: valkey-server /conf/valkey.conf

  # 从节点1
  slave1:
    image: valkey/valkey:latest
    container_name: valkey-slave1
    restart: no
    volumes:
      - ./valkey-slave1.conf:/conf/valkey.conf
    ports:
      - 6982:6982
    depends_on:
      - master
    # 192.168.31.180（替换成自己的IP）master节点宿主机IP地址，如果安装同一台机子上，不能写127.0.0.1 因为这样访问的是容器本身的地址
    # command: valkey-server --replicaof 192.168.31.180 6981 --port 6379 --requirepass 123456 --masterauth 123456 --appendonly yes
    command: valkey-server /conf/valkey.conf

  # 从节点2
  slave2:
    image: valkey/valkey:latest
    container_name: valkey-slave2
    restart: no
    volumes:
      - ./valkey-slave2.conf:/conf/valkey.conf
    ports:
      - 6983:6983
    depends_on:
      - master
    # 192.168.31.180（替换成自己的IP） master节点宿主机IP地址，如果安装同一台机子上，不能写127.0.0.1 因为这样访问的是容器本身的地址
    # command: valkey-server --replicaof 192.168.31.180 6981 --port 6379 --requirepass 123456 --masterauth 123456 --appendonly yes
    command: valkey-server /conf/valkey.conf

  # 哨兵节点1
  sentinel1:
    image: valkey/valkey:latest
    container_name: valkey-sentinel1
    restart: no
    volumes:
      - ./valkey-sentinel1.conf:/conf/valkey.conf
    ports:
      - 6984:6984
    depends_on:
      - master
      - slave1
      - slave2
    command: valkey-sentinel /conf/valkey.conf

  # 哨兵节点2
  sentinel2:
    image: valkey/valkey:latest
    container_name: valkey-sentinel2
    restart: no
    volumes:
      - ./valkey-sentinel2.conf:/conf/valkey.conf
    ports:
      - 6985:6985
    depends_on:
      - master
      - slave1
      - slave2
    command: valkey-sentinel /conf/valkey.conf