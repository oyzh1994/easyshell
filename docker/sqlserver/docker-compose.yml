name: easyshell-sqlserver

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: easyshell-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "easyshell@2026"
      MSSQL_PID: "Developer"
    ports:
      - "14333:1433"
    volumes:
      - easyshell-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  easyshell-sqlserver-data:
    name: easyshell-sqlserver-data
