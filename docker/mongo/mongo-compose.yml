services:
  mongodb:
    image: mongo:latest
    container_name: easyshell-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongo@2026
    volumes:
      - ./init.js:/docker-entrypoint-initdb.d/01-init.js:ro
      - ./complex-init.js:/docker-entrypoint-initdb.d/02-complex-init.js:ro
